<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0a08;
    --gold: #d4a843;
    --gold-light: #f0d68a;
    --text: #ded2ba;
    --muted: #968e7e;
    --line: rgba(212, 168, 67, 0.28);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Sarabun', system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 32px 16px;
    background-image: radial-gradient(60% 45% at 50% 0%, rgba(212, 168, 67, 0.10), transparent 70%);
  }
  .wrap { width: 100%; max-width: 620px; text-align: center; }
  .garuda { width: 132px; height: auto; opacity: 0.95; }
  .code {
    font-family: 'Outfit', sans-serif;
    font-size: clamp(25px, 7.1vw, 56px);
    font-weight: 800;
    line-height: 1.2;
    color: var(--gold-light);
    letter-spacing: 0.03em;
    margin: 22px 0 16px;
    white-space: nowrap;
  }
  .code .sep { color: rgba(212, 168, 67, 0.55); font-weight: 400; margin: 0 0.26em; }
  .code .n { color: var(--gold); }
  p { font-size: 15.5px; line-height: 1.95; color: var(--text); margin: 0 auto 26px; max-width: 470px; }
  p .dim { color: var(--muted); }
  .rule { width: 86px; height: 2px; background: var(--gold); opacity: 0.6; margin: 20px auto; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .links a {
    display: inline-block;
    padding: 11px 20px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(212, 168, 67, 0.07);
    color: var(--gold-light);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .links a:hover { background: rgba(212, 168, 67, 0.16); border-color: var(--gold); }
  .links a.primary { background: var(--gold); border-color: var(--gold); color: #17130a; }
  .links a.primary:hover { background: var(--gold-light); }
  .note { margin-top: 30px; font-size: 12.5px; color: rgba(150, 142, 126, 0.75); }
  @media (max-width: 420px) {
    .garuda { width: 108px; }
    p { font-size: 15px; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <img class="garuda" id="garuda" src="/Politic/images/Thai_Garuda_emblem.png" alt="">
    <div class="code">Dimension-2375<span class="sep">:</span><span class="n">404</span></div>
    <p>จากพิกัดในตอนนี้ ท่านอาจหลุดมาในช่องว่างระหว่างเรื่องราวนี้<br>
       <span class="dim">ท่านทำได้ยังไงหนะ</span> — เอาเป็นว่ากดปุ่มด้านล่างเพื่อกลับเข้าสู่จักรวาลของเรา</p>
    <div class="rule"></div>
    <nav class="links">
      <a class="primary" href="/Politic/">กลับเข้าสู่จักรวาลของเรา</a>
      <a href="/Politic/website_new.html">ฉบับเว็บใหม่</a>
      <a href="/Politic/website_constitution.html">ฉบับเว็บเดิม</a>
    </nav>
    <div class="note">โลกประวัติศาสตร์ทางเลือก · ไม่ใช่ข้อมูลจริง</div>
  </main>
<script>
/* The links above are written for GitHub Pages (/Politic/...). When the site is
   served from a different root — a local server, or a fork under another name —
   rewrite them against that root instead. */
(function () {
  var parts = location.pathname.split('/');
  var base = parts[1] === 'Politic' ? '/Politic/' : '/';
  if (base === '/Politic/') return;
  var fix = function (el, attr) {
    var v = el.getAttribute(attr);
    if (v && v.indexOf('/Politic/') === 0) el.setAttribute(attr, base + v.slice(9));
  };
  [].forEach.call(document.querySelectorAll('a[href], img[src], link[href]'), function (el) {
    fix(el, el.tagName === 'IMG' ? 'src' : 'href');
  });
})();
</script>
</body>
</html>
